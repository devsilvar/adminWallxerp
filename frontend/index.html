<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons - WallXERP by WallX -->
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title and Meta -->
    <title>The Toolkit For African Business Owners | WallXERP</title>
    <meta name="application-name" content="WallXERP" />
    <meta name="apple-mobile-web-app-title" content="WallXERP" />
    <meta
      name="description"
      content="The Toolkit For African Business Owners"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wallxerp.com/" />
    <meta
      property="og:title"
      content="WallXERP - The Toolkit For African Business Owners"
    />
    <meta
      property="og:description"
      content="The Toolkit For African Business Owners"
    />
    <meta property="og:site_name" content="WallXERP" />
    <meta property="og:image" content="https://wallxerp.com/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WallXERP Logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wallxerp.com/" />
    <meta
      name="twitter:title"
      content="WallXERP - The Toolkit For African Business Owners"
    />
    <meta
      name="twitter:description"
      content="The Toolkit For African Business Owners"
    />
    <meta name="twitter:image" content="https://wallxerp.com/logo.png" />
    <meta name="twitter:image:alt" content="WallXERP Logo" />

    <!-- WhatsApp / Telegram (uses Open Graph) -->
    <!-- WhatsApp and Telegram primarily use og: tags above, but we add these for completeness -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:image:type" content="image/png" />
    
    <!-- Additional meta for better mobile sharing -->
    <meta name="theme-color" content="#7c3aed" />
    <link rel="canonical" href="https://wallxerp.com/" />

    <!-- Preload critical assets -->
    <link
      rel="preload"
      as="image"
      href="/images-optimized/logo-64.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />

    <!-- Preconnect & DNS prefetch for critical external origins -->
    <link rel="preconnect" href="https://js.paystack.co" crossorigin />
    <link rel="dns-prefetch" href="https://js.paystack.co" />
    <link rel="dns-prefetch" href="https://wa.me" />

    <!-- Critical Path Inline CSS (Guarantees zero FOUC & zero CLS while async styles load) -->
    <style>
      :root {
        --font-sans:
          'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        --font-body:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #faf5ff;
        color: #0f172a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent layout shift by reserving space */
      body {
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
    </style>

    <!-- SEO -->
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="Nigeria tax, NRS calculator, business accounting, SME compliance"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
