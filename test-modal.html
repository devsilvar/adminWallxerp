<!DOCTYPE html>
<html>
<head>
  <title>Modal Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-4">Test Forgot Password Modal</h1>
    
    <button 
      id="testBtn"
      class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
    >
      Test API Call
    </button>

    <div id="result" class="mt-4 p-4 bg-gray-50 rounded text-sm font-mono"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center">
          ⚠️
        </div>
        <div>
          <h3 class="text-lg font-bold text-gray-900">Development Mode</h3>
          <p class="text-sm text-gray-600">Email service not configured</p>
        </div>
        <button onclick="closeModal()" class="ml-auto text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
        <p class="text-sm text-blue-900 mb-3">
          Since the email service isn't fully configured, here's your password reset link:
        </p>
        <div id="resetLinkDisplay" class="bg-white border border-blue-300 rounded p-3 mb-3 font-mono text-xs break-all text-gray-700"></div>
        <div class="flex gap-2">
          <button onclick="navigateToReset()" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Reset Password Now →
          </button>
          <button onclick="copyLink()" class="bg-white border-2 border-blue-600 text-blue-600 px-4 py-2 rounded hover:bg-blue-50">
            Copy 📋
          </button>
        </div>
      </div>

      <div class="bg-gray-50 rounded-lg p-3 text-xs text-gray-600">
        <strong>Note:</strong> This link is only shown in development mode.
      </div>
    </div>
  </div>

  <script>
    let currentResetLink = null;

    async function testApi() {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Loading...';

      try {
        const response = await fetch('http://localhost:3000/api/v1/auth/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email: 'yusuf@yopmail.com' })
        });

        const data = await response.json();
        
        resultDiv.textContent = JSON.stringify(data, null, 2);

        console.log('Full response:', data);
        console.log('data.data:', data.data);
        console.log('resetLink:', data.data?.resetLink);

        if (data.data?.resetLink) {
          currentResetLink = data.data.resetLink;
          document.getElementById('resetLinkDisplay').textContent = currentResetLink;
          document.getElementById('modal').classList.remove('hidden');
          console.log('✅ Modal should be visible now!');
        } else {
          console.log('❌ No resetLink found');
          alert('No reset link in response. Check console.');
        }

      } catch (error) {
        resultDiv.textContent = 'Error: ' + error.message;
        console.error('Error:', error);
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function navigateToReset() {
      if (currentResetLink) {
        window.location.href = currentResetLink;
      }
    }

    function copyLink() {
      if (currentResetLink) {
        navigator.clipboard.writeText(currentResetLink);
        alert('Link copied!');
      }
    }

    document.getElementById('testBtn').addEventListener('click', testApi);
  </script>
</body>
</html>
