<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- WallXERP Simplified 16x16 Favicon -->
  <defs>
    <style>
      .calc-box { fill: #5B4BA6; }
      .calc-symbol { fill: #ffffff; font-family: 'Arial', sans-serif; font-weight: bold; font-size: 5px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="16" height="16" rx="2" fill="#ffffff" />
  
  <!-- Calculator Grid (2x2) -->
  <!-- Top Left: + -->
  <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="0.8" class="calc-box" />
  <text x="4.25" y="5.8" text-anchor="middle" class="calc-symbol">+</text>
  
  <!-- Top Right: - -->
  <rect x="9" y="1.5" width="5.5" height="5.5" rx="0.8" class="calc-box" />
  <text x="11.75" y="5.5" text-anchor="middle" class="calc-symbol">−</text>
  
  <!-- Bottom Left: × -->
  <rect x="1.5" y="9" width="5.5" height="5.5" rx="0.8" class="calc-box" />
  <text x="4.25" y="13" text-anchor="middle" class="calc-symbol">×</text>
  
  <!-- Bottom Right: = -->
  <rect x="9" y="9" width="5.5" height="5.5" rx="0.8" class="calc-box" />
  <text x="11.75" y="12.8" text-anchor="middle" class="calc-symbol" style="font-size: 4.5px;">=</text>
</svg>
