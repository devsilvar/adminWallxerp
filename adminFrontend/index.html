<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons - WallXERP Admin by WallX -->
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title and Meta -->
    <title>Admin — WallXERP</title>
    <meta name="application-name" content="WallXERP Admin" />
    <meta name="apple-mobile-web-app-title" content="WallXERP Admin" />
    <meta property="og:title" content="WallXERP Admin" />
    <meta property="og:site_name" content="WallXERP Admin" />
    <meta
      name="description"
      content="Administrative portal for WallXERP platform operations."
    />

    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />

    <!-- Critical Path Inline CSS -->
    <style>
      :root {
        --font-sans:
          'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        --font-body:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-moz-osx-font-smoothing: grayscale;
      }
      body {
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
    </style>

    <!-- SEO -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
